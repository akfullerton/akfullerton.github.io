<header class="site-header">
  <div class="header-inner">
    <a class="wordmark" href="{{ '/' | relative_url }}" aria-label="Andrew Khoi Fullerton home">
      <span class="wordmark-mark" aria-hidden="true">AKF</span>
      <span class="wordmark-name">Andrew<br>Fullerton</span>
    </a>
    <nav class="site-nav" aria-label="Primary navigation">
      <a href="{{ '/' | relative_url }}"{% if page.url == '/' %} aria-current="page"{% endif %}>Home</a>
      <a href="{{ '/about/' | relative_url }}"{% if page.url == '/about/' %} aria-current="page"{% endif %}>About</a>
      <a href="{{ '/experience/' | relative_url }}"{% if page.url == '/experience/' %} aria-current="page"{% endif %}>Work</a>
      <a href="{{ '/contact/' | relative_url }}"{% if page.url == '/contact/' %} aria-current="page"{% endif %}>Contact</a>
    </nav>
    <button class="theme-toggle" type="button" aria-label="Switch to dark theme" data-theme-toggle>
      <span class="theme-icon theme-icon-sun" aria-hidden="true">☼</span>
      <span class="theme-icon theme-icon-moon" aria-hidden="true">◐</span>
    </button>
  </div>
</header>
